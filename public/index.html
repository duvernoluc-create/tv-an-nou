<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV An Nou</title>
<style>
:root{--p:#0b4fd1;--a:#e94b35;--g:#5fbf6f;--bg:#ffffff;--tx:#1b2430;--soft:#f3f6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header img{height:56px;max-width:60%;object-fit:contain}
.lang button{border:1px solid var(--p);background:none;color:var(--p);padding:6px 12px;font-weight:600;cursor:pointer}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button.on{background:var(--p);color:#fff}
.hero{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 70%,#000));color:#fff;border-radius:20px;padding:48px 28px;margin:8px 0 40px;text-align:center}
.hero h1{margin:0 0 10px;font-size:clamp(28px,6vw,46px);line-height:1.15}
.hero p{margin:0 auto 24px;max-width:560px;font-size:18px;opacity:.95}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;background:var(--a);color:#fff}
.btn.alt{background:#fff;color:var(--p)}
h2{font-size:26px;margin:0 0 14px}h2:after{content:"";display:block;width:48px;height:4px;border-radius:2px;background:var(--a);margin-top:8px}
section{margin:0 0 44px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--soft);border-radius:14px;padding:20px;border-top:4px solid var(--g);font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;display:block}
.contact{background:var(--soft);border-radius:16px;padding:24px;display:grid;gap:8px}
.contact a{color:var(--p);font-weight:600;text-decoration:none}
footer{text-align:center;color:#6b7683;font-size:14px;padding:24px 0 40px}
#editbtn,#mailbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--tx);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #0004;display:none}
#admin{position:fixed;inset:0;background:#000a;z-index:30;display:none;overflow:auto;padding:16px}
#admin .panel{background:#fff;color:#1b2430;max-width:640px;margin:0 auto;border-radius:16px;padding:20px}
.panel h3{margin:18px 0 8px;font-size:16px}.panel label{display:block;font-size:13px;color:#59636f;margin-top:8px}
.panel input[type=text],.panel textarea{width:100%;padding:9px;border:1px solid #cfd6de;border-radius:8px;font:inherit}
.panel textarea{min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.panel input[type=color]{width:100%;height:42px;border:1px solid #cfd6de;border-radius:8px;padding:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative}
.thumbs img{width:80px;height:60px;object-fit:cover;border-radius:8px}
.thumbs b{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;cursor:pointer;font-size:13px;line-height:20px}
.save{background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}
.cancel{background:#e6eaef;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 #e94b3566}50%{box-shadow:0 0 0 10px #e94b3500}}
@keyframes sh{from{background-position:0 50%}to{background-position:100% 50%}}
header img{animation:fl 3.5s ease-in-out infinite}
.hero{background-size:200% 200%;animation:up .8s both,sh 8s ease-in-out infinite alternate}
.hero h1{animation:up .8s .1s both}.hero p{animation:up .8s .25s both}.btns{animation:up .8s .4s both}
.btn{animation:pu 2.2s infinite;transition:transform .2s}.btn:hover{transform:translateY(-2px) scale(1.04)}
section{animation:up .8s both}
.card,.gal img{transition:transform .25s}.card:hover,.gal img:hover{transform:translateY(-6px)}
#mailbtn{right:auto;left:16px;background:var(--a)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<button id="editbtn"></button><button id="mailbtn"></button>

 '<label>Services — one per line (English)</label><textarea id="sv1">'+esc(D.services.en.join('\n'))+'</textarea><label>Services — une par ligne (Français)</label><textarea id="sv2">'+esc(D.services.fr.join('\n'))+'</textarea>'+
 '<h3>Contact</h3><div class="row"><input type="text" id="ph" placeholder="Phone" value="'+esc(D.phone)+'"><input type="text" id="wa" placeholder="WhatsApp" value="'+esc(D.whatsapp)+'"></div><label>Email</label><input type="text" id="em" value="'+esc(D.email)+'"><label>Address</label><input type="text" id="ad" value="'+esc(D.address)+'">'+
 '<h3>Photos</h3><input type="file" id="phf" accept="image/*" multiple><div class="thumbs" id="th"></div>'+
 '<p id="msg" style="color:#59636f;font-size:13px"></p><div class="row" style="margin-top:14px"><button class="cancel" id="cx">Cancel</button><button class="save" id="sv">Save &amp; publish</button></div></div>';
 a.style.display='block';thumbs();
 document.getElementById('lgf').onchange=function(e){if(e.target.files[0])img(e.target.files[0],500,'image/png').then(function(d){D.logo=d;document.getElementById('lg').src=d})};
 document.getElementById('phf').onchange=function(e){Promise.all([].map.call(e.target.files,function(f){return img(f,1100,'image/jpeg')})).then(function(l){D.photos=D.photos.concat(l);thumbs()})};
 document.getElementById('cx').onclick=function(){a.style.display='none';a.innerHTML=''};
 document.getElementById('sv').onclick=save;
}
function thumbs(){var t=document.getElementById('th');t.innerHTML=D.photos.map(function(p,i){return'<div><img src="'+p+'"><b data-i="'+i+'">×</b></div>'}).join('');t.querySelectorAll('b').forEach(function(b){b.onclick=function(){D.photos.splice(+b.dataset.i,1);thumbs()}})}
var SITE=location.origin;
function mailBody(l,n,t){var nm=CFG.name;
 if(l==="fr")return["Découvrez "+nm,"Bonjour "+n+",\n\n"+(t?t+"\n\n":"")+"Merci de votre intérêt pour "+nm+". Voici notre page avec nos services et nos coordonnées :\n\n"+SITE+"\n\nCordialement,\n"+nm];
 return["Discover "+nm,"Hello "+n+",\n\n"+(t?t+"\n\n":"")+"Thank you for your interest in "+nm+". Here is our page with our services and contact details:\n\n"+SITE+"\n\nBest regards,\n"+nm]}
async function sendMail(l){var m=document.getElementById("mm"),e=val("me");
 if(!e){m.style.color="#c0392b";m.textContent="Enter the client email";return}
 var p=document.getElementById("mp").files[0],att=[];
 if(p){var d=await img(p,1400,"image/jpeg");att=[{filename:"photo.jpg",content:d.split(",")[1]}]}
 var s=mailBody(l,val("mn"),val("mt"));m.style.color="#59636f";m.textContent="Sending…";
 try{var r=await fetch("/api/send",{method:"POST",body:JSON.stringify({password:PW,to:e,subject:s[0],text:s[1],attachments:att})});
  var j=await r.text();if(r.ok){m.style.color="#1a8a3a";m.textContent="✓ Sent!"}else{m.style.color="#c0392b";m.textContent="Error: "+j}}
 catch(x){m.style.color="#c0392b";m.textContent="Network error"}}
function openMail(){var a=document.getElementById("admin");
 a.innerHTML='<div class="panel"><h2>✉ Send to client / Envoyer au client</h2><label>Client name / Nom</label><input type="text" id="mn"><label>Client email</label><input type="text" id="me" placeholder="client@email.com"><label>Note / Message</label><textarea id="mt" placeholder="Optional"></textarea><label>📷 Photo (optional)</label><input type="file" id="mp" accept="image/*"><div class="row" style="margin-top:16px"><button class="save" id="g1">Send in English</button><button class="save" id="g2" style="background:var(--a)">Envoyer en français</button></div><p id="mm" style="font-size:14px;min-height:20px"></p><button class="cancel" id="mx">Close</button></div>';
 a.style.display="block";document.getElementById("g1").onclick=function(){sendMail("en")};document.getElementById("g2").onclick=function(){sendMail("fr")};
 document.getElementById("mx").onclick=function(){a.style.display="none";a.innerHTML=""}}
function lines(s){return s.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
var PW="";
function showBtns(){var b=document.getElementById("editbtn"),m=document.getElementById("mailbtn");b.style.display="block";b.onclick=openAdmin;m.textContent="✉ Send to client";m.style.display="block";m.onclick=openMail}
function adminLogin(){if(OWNER){openAdmin();return}
 var p=prompt("Admin password / Mot de passe admin");if(!p)return;
 fetch("/api/auth",{method:"POST",body:JSON.stringify({password:p})}).then(function(r){
  if(!r.ok){alert("Wrong password / Mot de passe incorrect");return}
  PW=p;OWNER=true;showBtns();openAdmin()}).catch(function(){alert("Server error")})}
async function save(){var m=document.getElementById('msg');
 D.colors={p:val('c1'),a:val('c2'),g:val('c3'),bg:val('c4')};D.name=val('nm');
 D.tagline={en:val('tg1'),fr:val('tg2')};D.about={en:val('ab1'),fr:val('ab2')};
 D.services={en:lines(val('sv1')),fr:lines(val('sv2'))};
 D.phone=val('ph');D.whatsapp=val('wa');D.email=val('em');D.address=val('ad');
 m.textContent='Saving…';
 try{var r=await fetch('/api/save',{method:'POST',body:JSON.stringify({password:PW,cfg:D})});
  if(!r.ok){m.textContent='Could not save ('+r.status+')';return}
  CFG=D;render();var a=document.getElementById('admin');a.style.display='none';a.innerHTML=''}
 catch(e){m.textContent='Could not save'}}
</script>
</body>
</html>
